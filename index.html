<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#16202e;--muted:#6b7686;--brand:#4f46e5;--brand2:#7c3aed;--err:#dc2626;--line:#e3e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;text-align:center;padding:48px 20px 80px;position:relative}
.hero .logo{font-size:46px}
.hero h1{margin:6px 0 4px;font-size:30px}
.hero p{margin:0;opacity:.9}
.lang{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.2);border:0;color:#fff;padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer}
.card{background:var(--card);max-width:420px;margin:-50px auto 24px;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(30,40,80,.12)}
.screen{display:none}.screen.on{display:block}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.1)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--card);color:var(--text)}
input:focus{outline:none;border-color:var(--brand)}
.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--bg);color:var(--text);margin-top:14px}
.err{color:var(--err);font-size:14px;margin-top:12px;min-height:20px;text-align:center}
.center{text-align:center}
</style>
</head>
<body>
<div class="hero">
  <button class="lang" id="langBtn"></button>
  <div class="logo">🛍️</div>
  <h1>Shop Pro</h1>
  <p data-t="tagline"></p>
</div>

<div class="card">
  <!-- شاشة الدخول -->
  <div id="login" class="screen on">
    <div class="tabs">
      <button id="tabIn" class="on" data-t="login"></button>
      <button id="tabUp" data-t="signup"></button>
    </div>
    <label data-t="phone"></label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="05XXXXXXXX" dir="ltr">
    <label data-t="pass"></label>
    <input id="pass" type="password" autocomplete="current-password" dir="ltr">
    <button class="btn" id="go"></button>
    <div class="err" id="err"></div>
  </div>

  <!-- لوحة المدير (مؤقتة) -->
  <div id="admin" class="screen center">
    <h2 data-t="adminTitle"></h2>
    <p data-t="soon"></p>
    <button class="btn ghost" data-logout data-t="logout"></button>
  </div>

  <!-- واجهة التاجر (مؤقتة) -->
  <div id="merchant" class="screen center">
    <h2 data-t="merchTitle"></h2>
    <p data-t="soon"></p>
    <button class="btn ghost" data-logout data-t="logout"></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== ضع بيانات مشروعك هنا (Project Settings > API) ======
const SUPABASE_URL = "https://rwguekadswzlylcpbfut.supabase.co";
const SUPABASE_KEY = "sb_publishable_GsQ6jOpk4T37s-Fg2l1glg_ozhu097d"; // مفتاح anon فقط، وليس service_role
// ===========================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const T = {
  ar: {tagline:'متجرك بين يديك', login:'دخول', signup:'حساب جديد', phone:'رقم الهاتف', pass:'كلمة السر',
       go:'دخول', create:'إنشاء الحساب', logout:'تسجيل الخروج', adminTitle:'لوحة المدير 👑', merchTitle:'واجهة التاجر 🏪',
       soon:'سنبني هذه الصفحة في الخطوة التالية.', badPhone:'أدخل رقم هاتف صحيحًا (10 أرقام)',
       badPass:'كلمة السر 6 أحرف على الأقل', badLogin:'رقم الهاتف أو كلمة السر غير صحيحة',
       exists:'هذا الرقم مسجّل من قبل، سجّل الدخول', generic:'حدث خطأ، حاول مرة أخرى', wait:'لحظة...', other:'FR'},
  fr: {tagline:'Votre boutique à portée de main', login:'Connexion', signup:'Nouveau compte', phone:'Numéro de téléphone',
       pass:'Mot de passe', go:'Se connecter', create:'Créer le compte', logout:'Déconnecter', adminTitle:'Tableau de bord admin 👑',
       merchTitle:'Espace commerçant 🏪', soon:'Cette page sera construite à la prochaine étape.',
       badPhone:'Entrez un numéro valide (10 chiffres)', badPass:'Mot de passe : 6 caractères minimum',
       badLogin:'Numéro ou mot de passe incorrect', exists:'Ce numéro est déjà inscrit, connectez-vous',
       generic:'Une erreur est survenue, réessayez', wait:'Un instant...', other:'AR'}
};

let lang = localStorage.getItem('lang') ||
  ((navigator.language || 'ar').toLowerCase().startsWith('fr') ? 'fr' : 'ar');
let mode = 'in'; // in = دخول، up = حساب جديد

const $ = id => document.getElementById(id);
const t = k => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('langBtn').textContent = t('other');
  $('go').textContent = mode === 'in' ? t('go') : t('create');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
}

function setMode(m) {
  mode = m;
  $('tabIn').classList.toggle('on', m === 'in');
  $('tabUp').classList.toggle('on', m === 'up');
  $('pass').autocomplete = m === 'in' ? 'current-password' : 'new-password';
  $('err').textContent = '';
  applyLang();
}

const toEmail = phone => phone + '@shoppro.app';

async function route() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return show('login');
  const { data } = await db.from('profiles').select('role').eq('id', session.user.id).single();
  show(data && data.role === 'admin' ? 'admin' : 'merchant');
}

async function submit() {
  const phone = $('phone').value.trim();
  const pass = $('pass').value;
  const err = $('err');
  err.textContent = '';
  if (!/^0[5-7]\d{8}$/.test(phone)) return err.textContent = t('badPhone');
  if (pass.length < 6) return err.textContent = t('badPass');

  $('go').disabled = true; $('go').textContent = t('wait');
  const creds = { email: toEmail(phone), password: pass };
  const { error } = mode === 'in' ? await db.auth.signInWithPassword(creds) : await db.auth.signUp(creds);
  $('go').disabled = false; applyLang();

  if (error) {
    const m = error.message || '';
    err.textContent = m.includes('Invalid login') ? t('badLogin') : m.includes('already') ? t('exists') : t('generic');
    return;
  }
  route();
}

$('go').onclick = submit;
$('tabIn').onclick = () => setMode('in');
$('tabUp').onclick = () => setMode('up');
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'fr' : 'ar'; localStorage.setItem('lang', lang); applyLang(); };
document.querySelectorAll('[data-logout]').forEach(b => b.onclick = async () => {
  await db.auth.signOut();
  $('pass').value = '';
  show('login');
});

applyLang();
route();
</script>
</body>
</html>
